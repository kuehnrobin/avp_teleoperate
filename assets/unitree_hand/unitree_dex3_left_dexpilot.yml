retargeting:
  type: DexPilot
  urdf_path: unitree_hand/unitree_dex3_left.urdf
  
  # Source refers to the retargeting input, which usually corresponds to the human hand
  # The joint indices of human hand joint which corresponds to each link in the target_link_names
  # Based on the Hand Joint index from https://support.unitree.com/home/en/G1_developer/dexterous_hand
  target_joint_names: 
    [
      "left_hand_thumb_0_joint", # 0
      "left_hand_thumb_1_joint", # 1
      "left_hand_thumb_2_joint", # 2
      "left_hand_middle_0_joint", # 3
      "left_hand_middle_1_joint", # 4
      "left_hand_index_0_joint", # 5
      "left_hand_index_1_joint", # 6
    ]
  # The link on the robot hand which corresponding to the wrist of human hand
  wrist_link_name: "left_hand_palm_link"
  # DexPilot retargeting link names
  finger_tip_link_names: ["left_hand_thumb_2_link", "left_hand_middle_1_link", "left_hand_index_1_link"] # thumb, middle, index
  
  target_link_human_indices:
  # Optimization parameters
  normal_delta:  4e-3
  huber_delta: 2e-2

  # DexPilot parameters
  project_dist: 0.03  # 1.5cm - enter grasp mode very early # TODO überprüfen
  escape_dist: 0.05     # 8cm - stable grasp mode with more hysteresis # TODO überprüfen
  
  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  low_pass_alpha: 0.2 #0.1
